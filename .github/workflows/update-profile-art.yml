name: Update profile art

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/make_assets.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/make_assets.py
      - name: Commit changes
        run: |
          git config user.name "Abdelhamid Noira"
          git config user.email "abdelhamid@noira.net"
          git add assets
          git diff --cached --quiet || git commit -m "Refresh profile art" && git push
